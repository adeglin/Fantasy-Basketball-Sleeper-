name: Update NBA Data
on:
  schedule:
    - cron: '0 12 * * *'   # Runs daily at 12:00 UTC (adjust as needed)
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python tools/update_nba_historical.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update NBA data" || exit 0
          git push https://<YOUR_PERSONAL_ACCESS_TOKEN>@github.com/<YOUR_GITHUB_USERNAME>/Fantasy-Basketball-Sleeper-.git HEAD:main
