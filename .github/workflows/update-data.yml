name: Update NBA data

on:
  schedule:
    # Every day at 8:00 UTC (adjust as you like)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nba_api requests

      - name: Update NBA historical data
        run: |
          python tools/update_nba_historical.py

      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_COMMITTER_EMAIL: "actions@github.com"
        run: |
          echo "========== GIT STATUS BEFORE =========="
          git status

          # Stage only the data file (and fetch_data cache if any)
          git add docs/data/nba_historical.json || true

          # If nothing was actually staged, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git commit -m "Update NBA data" || exit 0

          # IMPORTANT:
          # Replace REPLACE_WITH_YOUR_PAT with your actual PAT string once.
          # Example: ghp_abc123...
          git remote set-url origin https://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@github.com/adeglin/Fantasy-Basketball-Sleeper-.git

          git push origin main

          echo "========== GIT STATUS AFTER =========="
          git status
