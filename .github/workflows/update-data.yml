name: Update NBA Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 1. Checkout repository with correct token (FIXED)
      # -----------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # -----------------------------------------------------------
      # 3. Install Python requirements
      # -----------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install requests python-dateutil

      # -----------------------------------------------------------
      # 4. Run the updater script
      # -----------------------------------------------------------
      - name: Run update script
        env:
          ESPN_SCOREBOARD_URL: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
          ESPN_BOXSCORE_URL: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary"
        run: |
          python tools/update_nba_historical.py

      # -----------------------------------------------------------
      # 5. Git status output (for debugging)
      # -----------------------------------------------------------
      - name: Print git status
        run: |
          echo "========== GIT STATUS =========="
          git status
          echo "================================"

      # -----------------------------------------------------------
      # 6. Configure git to allow commit
      # -----------------------------------------------------------
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"

      # -----------------------------------------------------------
      # 7. Commit and push only if changed
      # -----------------------------------------------------------
      - name: Commit and push changes
        run: |
          git add docs/data/nba_historical.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NBA data"
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          fi
